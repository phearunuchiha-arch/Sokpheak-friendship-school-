<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOKPHEAK FRIENDSHIP SCHOOL - Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7488;--pr:#2457d6;--bd:#dfe4ee;--ok:#13875b;--no:#c93a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1b2231;--tx:#e8ecf5;--mu:#97a1b6;--pr:#6c93ff;--bd:#2c3547;--ok:#3ccf91;--no:#ff7b7b}}
:root[data-theme="dark"]{--bg:#121722;--card:#1b2231;--tx:#e8ecf5;--mu:#97a1b6;--pr:#6c93ff;--bd:#2c3547;--ok:#3ccf91;--no:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Khmer",system-ui,sans-serif;line-height:1.6}
header{background:var(--pr);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:1.05rem;margin:0}
header small{opacity:.85;display:block;font-weight:400}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:1.3rem}.stat span{color:var(--mu);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{font-size:.82rem;color:var(--mu);display:block}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
button{width:auto;cursor:pointer;background:var(--pr);color:#fff;border:0;font-weight:600}
button.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.d{background:var(--no);padding:4px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.bar>*{flex:1 1 140px}.bar button{flex:0 0 auto}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}
td.n,th.n{text-align:right}
h2{font-size:1rem;margin:0 0 10px}
.pill{background:var(--bg);border-radius:20px;padding:2px 10px;font-size:.8rem}
@media print{header button,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
  <h1 id="t_title">SOKPHEAK FRIENDSHIP SCHOOL<small id="t_sub"></small></h1>
  <div style="display:flex;gap:6px">
    <button class="g" style="background:#fff" onclick="toggleLang()" id="langBtn">EN</button>
  </div>
</header>
<main>
  <div class="card stats">
    <div class="stat"><b id="sTotal">$0</b><span data-t="total"></span></div>
    <div class="stat"><b id="sPaid" style="color:var(--ok)">$0</b><span data-t="paid"></span></div>
    <div class="stat"><b id="sDue" style="color:var(--no)">$0</b><span data-t="due"></span></div>
    <div class="stat"><b id="sStu">0</b><span data-t="students"></span></div>
  </div>

  <div class="card noprint">
    <h2 data-t="add"></h2>
    <div class="grid">
      <div><label data-t="name"></label><input id="f_name"></div>
      <div><label data-t="phone"></label><input id="f_phone" inputmode="tel"></div>
      <div><label data-t="cls"></label><input id="f_cls"></div>
      <div><label data-t="cat"></label><select id="f_cat"></select></div>
      <div><label data-t="amount"></label><input id="f_amt" type="number" min="0" step="0.01"></div>
      <div><label data-t="paidamt"></label><input id="f_paid" type="number" min="0" step="0.01" value="0"></div>
      <div><label data-t="date"></label><input id="f_date" type="date"></div>
      <div><label data-t="note"></label><input id="f_note"></div>
    </div>
    <p style="margin:10px 0 0"><button onclick="addRec()" data-t="save"></button></p>
  </div>

  <div class="card">
    <h2 data-t="records"></h2>
    <div class="bar noprint">
      <div><label data-t="search"></label><input id="q" oninput="render()"></div>
      <div><label data-t="month"></label><input id="m" type="month" onchange="render()"></div>
      <div><label data-t="cat"></label><select id="c" onchange="render()"></select></div>
      <button class="g" onclick="document.getElementById('m').value='';document.getElementById('q').value='';document.getElementById('c').value='';render()" data-t="clear"></button>
      <button onclick="exportCSV()" data-t="excel"></button>
      <button onclick="window.print()" data-t="pdf"></button>
    </div>
    <div class="wrap"><table>
      <thead><tr id="thead"></tr></thead><tbody id="rows"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h2 data-t="bymonth"></h2>
    <div class="wrap"><table><thead><tr><th data-t="month"></th><th class="n" data-t="total"></th><th class="n" data-t="paid"></th><th class="n" data-t="due"></th></tr></thead><tbody id="mrows"></tbody></table></div>
  </div>
</main>
<script>
const T={
km:{sub:"ប្រព័ន្ធហិរញ្ញវត្ថុសាលា — ចំណាយលើសិស្ស",total:"សរុបត្រូវបង់",paid:"បានបង់",due:"នៅជំពាក់",students:"ចំនួនសិស្ស",add:"បន្ថែមចំណាយសិស្ស",name:"ឈ្មោះសិស្ស",phone:"លេខទូរស័ព្ទ",cls:"ថ្នាក់",cat:"ប្រភេទចំណាយ",amount:"ចំនួនទឹកប្រាក់ ($)",paidamt:"បានបង់ ($)",date:"កាលបរិច្ឆេទ",note:"កំណត់ចំណាំ",save:"រក្សាទុក",records:"បញ្ជីចំណាយ",search:"ស្វែងរកតាមឈ្មោះ/ទូរស័ព្ទ",month:"ខែ",clear:"សម្អាត",excel:"ទាញ Excel",pdf:"ទាញ PDF",bymonth:"សង្ខេបតាមខែ",del:"លុប",empty:"មិនទាន់មានទិន្នន័យ",need:"សូមបំពេញឈ្មោះ និងចំនួនទឹកប្រាក់",sure:"តើចង់លុបមែនទេ?",cats:["ថ្លៃសិក្សា","សៀវភៅ","ឯកសណ្ឋាន","ឡានសាលា","អាហារ","ផ្សេងៗ"],all:"ទាំងអស់"},
en:{sub:"School Finance System — Student Expenses",total:"Total billed",paid:"Paid",due:"Outstanding",students:"Students",add:"Add student expense",name:"Student name",phone:"Phone",cls:"Class",cat:"Category",amount:"Amount ($)",paidamt:"Paid ($)",date:"Date",note:"Note",save:"Save",records:"Expense records",search:"Search name/phone",month:"Month",clear:"Clear",excel:"Export Excel",pdf:"Export PDF",bymonth:"Monthly summary",del:"Delete",empty:"No records yet",need:"Please enter name and amount",sure:"Delete this record?",cats:["Tuition","Books","Uniform","School bus","Meals","Other"],all:"All"}};
let lang=localStorage.getItem("lang")||"km",recs=[];
try{recs=JSON.parse(localStorage.getItem("recs")||"[]")}catch(e){recs=[]}
const $=id=>document.getElementById(id),t=k=>T[lang][k];
const fmt=n=>"$"+(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function save(){try{localStorage.setItem("recs",JSON.stringify(recs))}catch(e){}}
function toggleLang(){lang=lang==="km"?"en":"km";try{localStorage.setItem("lang",lang)}catch(e){}ui()}
function ui(){
  document.documentElement.lang=lang;$("langBtn").textContent=lang==="km"?"EN":"ខ្មែរ";$("t_sub").textContent=t("sub");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  const opts=T[lang].cats.map((c,i)=>`<option value="${i}">${c}</option>`).join("");
  $("f_cat").innerHTML=opts;$("c").innerHTML=`<option value="">${t("all")}</option>`+opts;
  $("thead").innerHTML=["name","phone","cls","cat","date","amount","paidamt","due",""].map((k,i)=>`<th class="${i>4&&i<8?"n":""}">${k?t(k):""}</th>`).join("");
  render();
}
function addRec(){
  const r={id:Date.now(),name:$("f_name").value.trim(),phone:$("f_phone").value.trim(),cls:$("f_cls").value.trim(),cat:+$("f_cat").value,amt:+$("f_amt").value,paid:+$("f_paid").value||0,date:$("f_date").value||new Date().toISOString().slice(0,10),note:$("f_note").value.trim()};
  if(!r.name||!(r.amt>0)){alert(t("need"));return}
  recs.unshift(r);save();["f_name","f_phone","f_cls","f_amt","f_note"].forEach(i=>$(i).value="");$("f_paid").value=0;render();
}
function delRec(id){if(confirm(t("sure"))){recs=recs.filter(r=>r.id!==id);save();render()}}
function filtered(){
  const q=$("q").value.toLowerCase(),m=$("m").value,c=$("c").value;
  return recs.filter(r=>(!q||r.name.toLowerCase().includes(q)||r.phone.includes(q))&&(!m||r.date.startsWith(m))&&(c===""||r.cat==+c));
}
function render(){
  const list=filtered();
  $("rows").innerHTML=list.length?list.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.cls)}</td><td><span class="pill">${T[lang].cats[r.cat]}</span></td><td>${r.date}</td><td class="n">${fmt(r.amt)}</td><td class="n">${fmt(r.paid)}</td><td class="n" style="color:${r.amt-r.paid>0?"var(--no)":"var(--ok)"}">${fmt(r.amt-r.paid)}</td><td class="noprint"><button class="d" onclick="delRec(${r.id})">${t("del")}</button></td></tr>`).join(""):`<tr><td colspan="9" style="color:var(--mu)">${t("empty")}</td></tr>`;
  const sum=a=>a.reduce((s,r)=>s+r.amt,0),sp=a=>a.reduce((s,r)=>s+r.paid,0);
  $("sTotal").textContent=fmt(sum(list));$("sPaid").textContent=fmt(sp(list));$("sDue").textContent=fmt(sum(list)-sp(list));
  $("sStu").textContent=new Set(list.map(r=>r.name.toLowerCase())).size;
  const mm={};recs.forEach(r=>{const k=r.date.slice(0,7);(mm[k]=mm[k]||[]).push(r)});
  $("mrows").innerHTML=Object.keys(mm).sort().reverse().map(k=>`<tr><td>${k}</td><td class="n">${fmt(sum(mm[k]))}</td><td class="n">${fmt(sp(mm[k]))}</td><td class="n">${fmt(sum(mm[k])-sp(mm[k]))}</td></tr>`).join("");
}
function exportCSV(){
  const h=["name","phone","cls","cat","date","amount","paidamt","due","note"].map(t);
  const rows=filtered().map(r=>[r.name,r.phone,r.cls,T[lang].cats[r.cat],r.date,r.amt,r.paid,r.amt-r.paid,r.note]);
  const csv="\uFEFF"+[h,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="school-finance.csv";document.body.appendChild(a);a.click();a.remove();
}
$("f_date").value=new Date().toISOString().slice(0,10);
ui();
</script>
</body>
</html>
